<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hospital HMS - Login</title>

    <link rel="stylesheet"
          href="/static/css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="login-container">

    <!-- ================= LEFT SIDE ================= -->

    <div class="login-left">

        <div class="hospital-icon">

            <i class="fa-solid fa-hospital"></i>

        </div>

        <h1>Hospital HMS</h1>

        <p>
            Hospital Hospitality Management System
        </p>

        <div class="welcome-text">

            <h2>Welcome Back!</h2>

            <p>
                Manage your hospital operations
                efficiently from one place.
            </p>

        </div>

    </div>


    <!-- ================= RIGHT SIDE ================= -->

    <div class="login-right">

        <div class="login-box">

            <div class="login-header">

                <i class="fa-solid fa-user-shield"></i>

                <h2>Admin Login</h2>

                <p>
                    Sign in to access Hospital HMS
                </p>

            </div>


            <!-- ERROR MESSAGE -->

            {% if error %}

            <div class="error-message">

                <i class="fa-solid fa-circle-exclamation"></i>

                {{ error }}

            </div>

            {% endif %}


            <!-- LOGIN FORM -->

            <form action="/login"
                  method="POST">

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter username"
                            autocomplete="username"
                            required>

                    </div>

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="login-btn">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login

                </button>

            </form>


            <div class="login-footer">

                <p>
                    © 2026 Hospital Hospitality
                    Management System
                </p>

            </div>

        </div>

    </div>

</div>


<script src="/static/js/login.js"></script>

</body>

</html>
